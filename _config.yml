theme: jekyll-theme-cayman
title: Horizon 综合决策雷达
description: 用多源新闻理解变化，再发现值得验证的创业机会
baseurl: "/Horizon"
url: "https://bbhnation.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
