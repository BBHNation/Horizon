theme: jekyll-theme-cayman
title: Startup Radar
description: 为独立开发者发现可验证的创业机会
baseurl: "/Horizon"
url: "https://bbhnation.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
