name: Weekly Startup Radar

on:
  schedule:
    # Run every Friday at 08:00 Asia/Shanghai (GitHub cron uses UTC).
    - cron: '0 0 * * 5'
  workflow_dispatch:      # Allow manual trigger

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Restore Startup Radar history
        uses: actions/cache/restore@v4
        with:
          path: data/startup_radar.db
          key: startup-radar-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            startup-radar-db-

      - name: Run Startup Radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run startup-radar --hours 168

      - name: Save Startup Radar history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/startup_radar.db
          key: startup-radar-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "🚀 Startup Radar: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
